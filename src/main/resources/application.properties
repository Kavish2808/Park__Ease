spring.application.name=parkease-api
# Local secrets (DB_PASSWORD, JWT_SECRET, ...) are read from the git-ignored .env file; see .env.example.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parkease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=never
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-32-character-minimum-key}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
